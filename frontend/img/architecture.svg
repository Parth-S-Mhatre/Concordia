<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill: #F2F4F0; }
      .layer { fill: #173B35; stroke: #173B35; stroke-width: 2; }
      .layer-title { fill: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .layer-subtitle { fill: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; text-anchor: middle; }
      .box { fill: #F2F4F0; stroke: #6D9890; stroke-width: 1.5; }
      .box-title { fill: #173B35; font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .box-text { fill: #173B35; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 400; text-anchor: middle; }
      .core-box { fill: #F2F4F0; stroke: #D2A24C; stroke-width: 3; }
      .core-title { fill: #173B35; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .arrow { stroke: #D2A24C; stroke-width: 2.5; fill: none; marker-end: url(#arrowGold); }
      .dark-arrow { stroke: #173B35; stroke-width: 2.5; fill: none; marker-end: url(#arrowDark); }
      .annotation { fill: #173B35; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .pipeline-border { fill: none; stroke: #D2A24C; stroke-width: 2; }
      .pipeline-box { fill: #173B35; }
      .pipeline-text { fill: #FFFFFF; font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .pipeline-arrow { stroke: #D2A24C; stroke-width: 2.5; fill: none; marker-end: url(#arrowGold); }
    </style>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D2A24C"/>
    </marker>
    <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#173B35"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" class="bg"/>

  <!-- LAYER 1 — CLIENTS -->
  <rect x="20" y="20" width="1560" height="160" rx="10" class="layer"/>
  <text x="800" y="51" class="layer-title">LAYER 1 — CLIENTS</text>
  <text x="800" y="72" class="layer-subtitle">(static HTML/CSS/JS, no build step)</text>

  <rect x="42" y="95" width="510" height="68" rx="7" class="box"/>
  <text x="297" y="122" class="box-title">Landing page</text>
  <text x="297" y="144" class="box-text">(index.html · overview + demo flow)</text>

  <rect x="570" y="95" width="510" height="68" rx="7" class="box"/>
  <text x="825" y="122" class="box-title">Login page</text>
  <text x="825" y="144" class="box-text">(login.html · sign in / sign up)</text>

  <rect x="1098" y="95" width="510" height="68" rx="7" class="box"/>
  <text x="1353" y="122" class="box-title">Workspace app</text>
  <text x="1353" y="144" class="box-text">(app.html · dashboard → search)</text>

  <path d="M1080 129 L1092 129" class="arrow"/>

  <text x="800" y="198" class="annotation">Workspace Login page flows into Workspace app</text>
  <text x="1240" y="198" class="annotation">All clients call all five API routers</text>

  <!-- LAYER 2 — API LAYER -->
  <rect x="20" y="215" width="1560" height="165" rx="10" class="layer"/>
  <text x="800" y="246" class="layer-title">LAYER 2 — API LAYER</text>
  <text x="800" y="267" class="layer-subtitle">(FastAPI + Pydantic, REST/JSON)</text>

  <rect x="42" y="292" width="290" height="65" rx="7" class="box"/>
  <text x="187" y="318" class="box-title">auth</text>
  <text x="187" y="340" class="box-text">(config · me · Firebase token verify)</text>

  <rect x="350" y="292" width="290" height="65" rx="7" class="box"/>
  <text x="495" y="318" class="box-title">sources</text>
  <text x="495" y="340" class="box-text">(upload · schema · mapping)</text>

  <rect x="658" y="292" width="290" height="65" rx="7" class="box"/>
  <text x="803" y="318" class="box-title">processing</text>
  <text x="803" y="340" class="box-text">(jobs · resume · stats)</text>

  <rect x="966" y="292" width="290" height="65" rx="7" class="box"/>
  <text x="1111" y="318" class="box-title">search</text>
  <text x="1111" y="340" class="box-text">(enrich · suggest)</text>

  <rect x="1274" y="292" width="290" height="65" rx="7" class="box"/>
  <text x="1419" y="318" class="box-title">entities</text>
  <text x="1419" y="340" class="box-text">(graph · history · traceability)</text>

  <path d="M800 180 L800 210" class="dark-arrow"/>

  <path d="M1240 180 L1240 205 M1240 205 L187 205 L187 287 M1240 205 L495 205 L495 287 M1240 205 L803 205 L803 287 M1240 205 L1111 205 L1111 287 M1240 205 L1419 205 L1419 287" stroke="#173B35" stroke-width="1.5" fill="none"/>

  <!-- LAYER 3 — SERVICES -->
  <rect x="20" y="415" width="1560" height="200" rx="10" class="layer"/>
  <text x="800" y="446" class="layer-title">LAYER 3 — SERVICES</text>
  <text x="800" y="467" class="layer-subtitle">(batched, resumable background jobs)</text>

  <rect x="42" y="490" width="205" height="100" rx="7" class="box"/>
  <text x="144.5" y="521" class="box-title">Ingest</text>
  <text x="144.5" y="547" class="box-text">(CSV · SQL dumps ·</text>
  <text x="144.5" y="565" class="box-text">multi-part)</text>

  <rect x="264" y="490" width="205" height="100" rx="7" class="box"/>
  <text x="366.5" y="521" class="box-title">Map</text>
  <text x="366.5" y="547" class="box-text">(AI suggestions +</text>
  <text x="366.5" y="565" class="box-text">rule fallback, human review)</text>

  <rect x="486" y="490" width="205" height="100" rx="7" class="box"/>
  <text x="588.5" y="521" class="box-title">Normalize</text>
  <text x="588.5" y="547" class="box-text">(raw + cleaned</text>
  <text x="588.5" y="565" class="box-text">values preserved)</text>

  <rect x="708" y="490" width="205" height="100" rx="7" class="box"/>
  <text x="810.5" y="521" class="box-title">Match</text>
  <text x="810.5" y="547" class="box-text">(email → phone →</text>
  <text x="810.5" y="565" class="box-text">username → member-ID</text>
  <text x="810.5" y="583" class="box-text">hierarchy + fuzzy)</text>

  <rect x="930" y="490" width="205" height="100" rx="7" class="core-box"/>
  <text x="1032.5" y="518" class="core-title">★ Enrich — CORE</text>
  <text x="1032.5" y="544" class="box-text">(BFS over discovered</text>
  <text x="1032.5" y="562" class="box-text">identifiers until</text>
  <text x="1032.5" y="580" class="box-text">exhaustion)</text>

  <rect x="1152" y="490" width="205" height="100" rx="7" class="box"/>
  <text x="1254.5" y="521" class="box-title">Cache</text>
  <text x="1254.5" y="547" class="box-text">(Redis or in-memory,</text>
  <text x="1254.5" y="565" class="box-text">TTL)</text>

  <rect x="1374" y="490" width="205" height="100" rx="7" class="box"/>
  <text x="1476.5" y="521" class="box-title">Quality</text>
  <text x="1476.5" y="547" class="box-text">(profiling · relationship</text>
  <text x="1476.5" y="565" class="box-text">inference · dedup)</text>

  <path d="M800 380 L800 410" class="dark-arrow"/>

  <text x="800" y="634" class="annotation">Services read/write Firestore</text>

  <!-- LAYER 4 — DATA -->
  <rect x="20" y="650" width="1560" height="125" rx="10" class="layer"/>
  <text x="800" y="680" class="layer-title">LAYER 4 — DATA</text>

  <rect x="42" y="700" width="768" height="55" rx="7" class="box"/>
  <text x="426" y="723" class="box-title">Firestore</text>
  <text x="426" y="744" class="box-text">(sources · records · entities · processing_jobs · indexes)</text>

  <rect x="830" y="700" width="728" height="55" rx="7" class="box"/>
  <text x="1194" y="723" class="box-title">Redis — optional</text>
  <text x="1194" y="744" class="box-text">(search + suggestion cache)</text>

  <path d="M426 590 L426 694" class="dark-arrow"/>
  <path d="M1032 590 L1032 694" class="dark-arrow"/>

  <!-- 5-STEP PIPELINE -->
  <rect x="20" y="800" width="1560" height="80" rx="12" class="pipeline-border"/>
  <text x="800" y="820" fill="#173B35" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5-STEP PIPELINE</text>

  <rect x="50" y="835" width="270" height="32" rx="6" class="pipeline-box"/>
  <text x="185" y="857" class="pipeline-text">Ingest</text>

  <rect x="360" y="835" width="270" height="32" rx="6" class="pipeline-box"/>
  <text x="495" y="857" class="pipeline-text">Inspect</text>

  <rect x="670" y="835" width="270" height="32" rx="6" class="pipeline-box"/>
  <text x="805" y="857" class="pipeline-text">Map</text>

  <rect x="980" y="835" width="270" height="32" rx="6" class="pipeline-box"/>
  <text x="1115" y="857" class="pipeline-text">Process</text>

  <rect x="1290" y="835" width="270" height="32" rx="6" class="pipeline-box"/>
  <text x="1425" y="857" class="pipeline-text">Enrich &amp; Search</text>

  <path d="M325 851 L350 851" class="pipeline-arrow"/>
  <path d="M635 851 L660 851" class="pipeline-arrow"/>
  <path d="M945 851 L970 851" class="pipeline-arrow"/>
  <path d="M1255 851 L1280 851" class="pipeline-arrow"/>
</svg>
